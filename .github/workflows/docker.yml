name: docker-multiarch

on:
  # 手动触发
  workflow_dispatch:

  push:
    branches: ["main"]
    tags: ["v*"]
    # 只在这些文件/目录变更时触发（可按需调整）
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/**"
      - "**/*.sh"
      - "**/*.py"
      - "**/*.txt"
      - "**/*.lock"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wmk0823/graaply-deps
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push (by digest) + GHA cache
        id: buildpush
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=wmk0823/graaply-deps,push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.buildpush.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: /tmp/digests/*.digest

  merge:
    name: Merge manifest (multi-arch tags)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digests
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wmk0823/graaply-deps
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          AMD_DIGEST="$(cat /tmp/digests/amd64.digest)"
          ARM_DIGEST="$(cat /tmp/digests/arm64.digest)"

          while read -r tag; do
            docker buildx imagetools create \
              -t "${tag}" \
              "wmk0823/graaply-deps@${AMD_DIGEST}" \
              "wmk0823/graaply-deps@${ARM_DIGEST}"
          done <<< "${{ steps.meta.outputs.tags }}"
